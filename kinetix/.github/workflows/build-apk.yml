name: Build Kinetix APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build locales (fa/en)
        run: npm run locales

      - name: Add Android platform (first run only)
        run: test -d android || npx cap add android

      - name: Generate icons and splash
        run: npx capacitor-assets generate --android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Ensure network permissions
        run: node scripts/patch-android.mjs

      - name: Build debug APK (fallback)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build release APK
        id: release
        continue-on-error: true
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Show signing certificate
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | head -3 || true

      - name: Upload APK
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: Kinetix-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Download link in summary
        run: |
          echo "### Kinetix APK آماده است ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[دانلود APK](${{ steps.upload.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "(برای دانلود باید در گیت‌هاب لاگین باشید. فایل ZIP شامل release/app-release.apk است؛ نسخهٔ نصبی همین است. debug/app-debug.apk فقط پشتیبان است.)" >> "$GITHUB_STEP_SUMMARY"
