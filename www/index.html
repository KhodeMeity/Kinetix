<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Kinetix</title>
  <meta name="theme-color" content="#090b0e">
  <meta name="application-name" content="Kinetix">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <style>html{background:#090b0e}html[data-theme="light"]{background:#f2f3ec}</style>
  <script>
    /* تم و زبان را پیش از رندر ست می‌کنیم تا چشمک نزند */
    (function () {
      try {
        var d = JSON.parse(localStorage.getItem('calis-app-v1') || '{}');
        var t = d.theme || (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', t);
        var fs = [1, 1.15, 1.3, 1.5][(+d.font || 1) - 1] || 1; document.documentElement.style.setProperty('--fs', fs);
        var l = d.lang === 'en' ? 'en' : 'fa';
        document.documentElement.lang = l; document.documentElement.dir = l === 'en' ? 'ltr' : 'rtl';
        document.documentElement.setAttribute('data-lang', l);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="bg-glow" aria-hidden="true"></div>

<div class="app">
  <!-- ======= منوی کناری (دسکتاپ) ======= -->
  <aside class="side">
    <a class="logo" href="#home" aria-label="Kinetix">
      <span class="logo-mark"><svg class="ico"><use href="#p-pull"/></svg></span>
      <span class="logo-text"><b>Kinetix</b><small data-i18n="app.tagline">دفتر تمرین من</small></span>
    </a>

    <nav class="nav" id="sideNav" data-i18n-attr="aria-label:app.nav" aria-label="بخش‌ها"></nav>

    <div class="week-card" id="weekCard"></div>
  </aside>

  <!-- ======= محتوای اصلی ======= -->
  <main class="main">
    <header class="topbar">
      <div class="titles">
        <h1 id="pageTitle">Kinetix</h1>
        <p id="pageSub" class="sub"></p>
      </div>
      <div class="top-actions">
        <span class="date-chip" id="dateChip"></span>
      </div>
    </header>

    <div id="subNav"></div>
    <section id="view" class="view" aria-live="polite"></section>
  </main>
</div>

<!-- ======= نوار پایین (موبایل) ======= -->
<nav class="tabbar" id="tabBar" data-i18n-attr="aria-label:app.nav" aria-label="بخش‌ها"></nav>

<div id="runner" class="rn" role="dialog" aria-modal="true" aria-labelledby="rn-h" hidden></div>
<dialog id="modal" class="modal"></dialog>
<div id="toast" class="toast" role="status"></div>
